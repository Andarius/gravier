[project]
name = "gravier"
version = "0.1.0"
description = "Small typed wrapper around granian's RSGI interface: router, lifecycle, SSE, OpenAPI, test utilities"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Julien Brayere", email = "julien.brayere@obitrain.com" }
]
requires-python = ">=3.13"
dependencies = [
    "granian>=2.2.3",
    "msgspec>=0.19.0",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "niquests>=3.21.0",
    "pyright>=1.1.400",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
]
bump = [
    "commitizen>=4.0.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
update_changelog_on_bump = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
combine-as-imports = true
