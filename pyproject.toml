[project]
name = "gravier"
version = "0.1.0"
description = "Small typed wrapper around granian's RSGI interface: router, lifecycle, SSE, OpenAPI, test utilities"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Julien Brayere", email = "julien.brayere@obitrain.com" }
]
requires-python = ">=3.15.2"
dependencies = [
    "granian>=2.8.7",
    "msgspec>=0.22.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.13.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "niquests>=3.21.2",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
bump = [
    "commitizen>=4.19.3",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
update_changelog_on_bump = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
combine-as-imports = true
